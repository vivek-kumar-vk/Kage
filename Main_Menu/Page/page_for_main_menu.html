<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INKY.GG — Home</title>
<style>
  @import url('/shared/colours_and_fonts.css');
  @import url('/shared/responsive_layout.css');
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 100%; background: var(--ink-void); color: var(--bone); font-family: var(--font-body); }

  body {
    height: var(--screen-height, 100vh);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  a { color: inherit; text-decoration: none; }

  /* ═══════ SHELL: sidebar + main ═══════ */
  .shell { display: flex; flex: 1; min-height: 0; }

  /* ═══════ SIDEBAR ═══════ */
  .sidebar {
    width: 232px;
    flex-shrink: 0;
    background: var(--ink-panel);
    border-right: 1px solid var(--sumi-line);
    display: flex;
    flex-direction: column;
    padding: 26px 0;
    overflow-y: auto;
  }
  .sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 0 24px 26px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand span {
    font-family: var(--font-display); font-weight: 700; font-size: 1.05rem;
    letter-spacing: 1.5px; color: var(--bone);
  }
  .utility-rail.mobile-only { display: none; gap: 8px; }

  .nav-list { display: flex; flex-direction: column; }
  .nav-group + .nav-group { margin-top: 18px; }
  .nav-divider { height: 1px; background: var(--sumi-line); margin: 18px 24px; }

  .nav-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 24px;
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: background var(--move-tab, 120ms), border-color var(--move-tab, 120ms);
  }
  .nav-row:hover { background: var(--ink-raised); }
  .nav-row.active { border-left-color: var(--p5-cyan); background: var(--ink-raised); }
  .nav-row.active .nav-icon svg { stroke: var(--bone); }
  .nav-row.unavailable { opacity: 0.35; cursor: default; }
  .nav-row.unavailable:hover { background: none; }
  .nav-icon { display: flex; flex-shrink: 0; }
  .nav-label {
    font-family: var(--font-display); font-weight: 600; font-size: 0.85rem;
    letter-spacing: 0.5px; color: var(--bone-dim); white-space: nowrap;
  }
  .nav-row.active .nav-label { color: var(--bone); }

  .sidebar-footer { flex: 1; display: flex; align-items: flex-end; padding: 0 24px; }
  .sidebar-footer span {
    font-family: var(--font-body); font-size: 0.62rem; letter-spacing: 0.5px; color: var(--bone-dim);
  }

  .nav-error { padding: 12px 24px; font-family: var(--font-body); font-size: 0.7rem; color: var(--bone-dim); }

  /* ═══════ MAIN ═══════ */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 32px 40px; gap: 24px; overflow-y: auto; }

  /* ═══════ TOP BRIEF CARDS ═══════ */
  .brief-meta { display: flex; justify-content: flex-end; }
  .as-of { font-family: var(--font-body); font-size: 0.62rem; letter-spacing: 0.5px; color: var(--bone-dim); }

  /* SIX cards, ONE line, always - fixed columns, not auto-fit, because
     auto-fit let the clock wrap onto a row of its own and waste a whole
     strip of the page. Cards shrink instead of wrapping; the type above
     clamps with them. min-width: 0 is what lets a grid cell shrink. */
  .card-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; flex-shrink: 0; }
  .stat-card { position: relative; background: var(--ink-panel); border: 1px solid var(--sumi-line); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  /* The cost card carries two figures side by side but takes ONE column
     like everybody else - six blocks, one line, no straggler below. */
  .stat-card.wide { grid-column: auto; }

  /* One icon per card, as asked - all five re-fetch the same noticeboard
     read (that is genuinely what backs every card), so clicking any one
     of them refreshes all of them. Rule 6: a number's age has to be
     visible, so every refresh also updates the AS OF line above. */
  .card-refresh {
    position: absolute; top: 10px; right: 10px;
    width: 22px; height: 22px; padding: 0; border: none; background: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--bone-dim); opacity: 0.5; cursor: pointer;
    transition: opacity var(--move-tab, 120ms), color var(--move-tab, 120ms);
  }
  .card-refresh:hover { opacity: 1; color: var(--p5-cyan); }
  .card-refresh.spinning svg { animation: card-refresh-spin 0.6s linear infinite; }
  @keyframes card-refresh-spin { to { transform: rotate(360deg); } }
  /* Right-padded so the label never runs under the refresh icon, at
     any card width down to the 132px mobile-landscape strip. */
  .stat-label { font-family: var(--font-body); font-size: 0.68rem; letter-spacing: 0.5px; text-transform: uppercase; color: var(--bone-dim); padding-right: 22px; }
  .stat-value { font-family: var(--font-data); font-size: clamp(0.95rem, 1.25vw, 1.5rem); font-variant-numeric: tabular-nums; color: var(--bone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-value.vermilion { color: var(--vermilion); }
  .stat-value.jade { color: var(--jade); }
  .stat-value.dim { color: var(--bone-dim); }
  .stat-sub { font-family: var(--font-body); font-size: 0.7rem; color: var(--bone-dim); }

  /* the two not-yet-built cards: same shape, honestly empty */
  .stat-card.empty .stat-value { color: var(--bone-dim); }

  /* Loading and failure states, toggled as classes by the JS. While a
     noticeboard read is in flight the card is covered and a ring spins;
     if the source answers with nothing usable, the failure is printed
     rather than papered over (C12 - honest states, never a guess). */
  .stat-card.loading::after {
    content: ""; position: absolute; inset: 0;
    background: inherit; opacity: 0.85;
  }
  .stat-card.loading::before {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 18px; height: 18px; margin: -9px 0 0 -9px; z-index: 1;
    border: 2px solid var(--sumi-line); border-top-color: var(--p5-cyan);
    border-radius: 50%;
    animation: stat-spin 0.7s linear infinite;
  }
  @keyframes stat-spin { to { transform: rotate(360deg); } }
  .stat-value.error-state { color: var(--vermilion); font-size: 0.8rem; }
  .stat-sub.error-note { color: var(--vermilion); }

  /* the cost card: two providers, side by side */
  .usage-split { display: flex; gap: 14px; flex: 1; min-width: 0; }
  .usage-col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .usage-col .who { font-family: var(--font-body); font-size: 0.62rem; letter-spacing: 0.5px; text-transform: uppercase; color: var(--bone-dim); }
  .usage-col .cost { font-family: var(--font-data); font-size: clamp(0.85rem, 1vw, 1.15rem); font-variant-numeric: tabular-nums; color: var(--bone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .usage-col .tokens { font-family: var(--font-data); font-size: 0.66rem; color: var(--bone-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ═══════ CONTENT ROW: chat left, agents right, rail far right ═══════ */
  .content-row { flex: 1; min-height: 0; display: flex; gap: 20px; }

  /* The chat sits LEFT, directly under the left-most metric cards, at a
     reading width; the agents box takes whatever width is left over. It
     used to centre itself, which stranded dead space on both sides. */
  .chat-panel {
    flex: 0 1 480px; min-width: 0; min-height: 0; display: flex;
  }
  .chat-card {
    width: 100%; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--ink-panel); border: 1px solid var(--sumi-line);
  }

  /* ═══════ FLOATING WINDOWS ═══════
     The calendar and notes live in small fixed windows over the page
     rather than being screens of their own - one shared design, two
     contents. Overlay sits under the windows; both sit over the page. */
  .window-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 90; }
  .floating-window {
    position: fixed; right: 76px; top: 96px;   /* clears the utility rail */
    width: min(360px, 92%);
    /* Plain vh, never calc(vh - px): a hand-measured header height goes
       wrong the day anything above changes (C9). */
    max-height: min(560px, 80vh);
    display: flex; flex-direction: column;
    background: var(--ink-panel); border: 1px solid var(--sumi-line);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    z-index: 100;
  }
  /* [hidden] loses to any later display rule, so restate it - these two
     must genuinely vanish, not merely sit invisible-but-clickable. */
  .window-overlay[hidden], .floating-window[hidden] { display: none; }

  /* The calendar reads like a real month wall - event chips inside day
     cells need width - so it gets more room than the notes sheet. */
  #calendar-window { width: min(680px, 94%); max-height: min(700px, 86vh); }

  .window-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 14px 16px;
    border-bottom: 1px solid var(--sumi-line); flex-shrink: 0;
  }
  .window-title {
    font-family: var(--font-display); font-weight: 700; font-size: 0.8rem;
    letter-spacing: 1.5px; color: var(--bone);
  }
  .window-close {
    width: 28px; height: 28px; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 1px solid transparent; color: var(--bone-dim);
    cursor: pointer;
    transition: border-color var(--move-tab, 120ms), color var(--move-tab, 120ms);
  }
  .window-close:hover { border-color: var(--p5-cyan); color: var(--p5-cyan); }
  .window-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 14px 16px; }

  /* Notes */
  .notes-body { gap: 10px; }
  .notes-area {
    flex: 1; min-height: 0; resize: none; overflow-y: auto;
    background: var(--ink-void); border: 1px solid var(--sumi-line);
    padding: 14px; color: var(--bone);
    font-family: var(--font-body); font-size: 0.85rem; line-height: 1.5;
  }
  .notes-area::placeholder { color: var(--bone-dim); }
  .notes-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
  .notes-hint { font-family: var(--font-body); font-size: 0.62rem; letter-spacing: 0.5px; color: var(--bone-dim); }
  .notes-clear {
    padding: 6px 12px; background: none;
    border: 1px solid var(--vermilion); color: var(--vermilion);
    font-family: var(--font-display); font-weight: 600; font-size: 0.66rem; letter-spacing: 1px;
    cursor: pointer;
    transition: background var(--move-tab, 120ms), color var(--move-tab, 120ms);
  }
  .notes-clear:hover { background: var(--vermilion); color: var(--bone); }

  /* Calendar - the month grid is rendered by home_windows.js into
     #calendar-body; these are the styles that rendering lands on. */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
  .cal-month, .cal-label {
    font-family: var(--font-display); font-weight: 600; font-size: 0.78rem;
    letter-spacing: 1px; color: var(--bone);
  }
  .cal-nav {
    width: 26px; height: 26px; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 1px solid var(--sumi-line); color: var(--bone-dim);
    cursor: pointer;
    transition: border-color var(--move-tab, 120ms), color var(--move-tab, 120ms);
  }
  .cal-nav:hover { border-color: var(--p5-cyan); color: var(--p5-cyan); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow {
    text-align: center; padding-bottom: 4px;
    font-family: var(--font-body); font-size: 0.58rem; letter-spacing: 0.5px;
    color: var(--bone-dim);
  }
  /* A day is a small wall cell, not a centred number: the date sits in
     its corner and the day's events stack underneath it as chips, the
     way a real calendar shows what a day HOLDS rather than that the day
     exists. */
  .cal-day {
    display: flex; flex-direction: column; align-items: stretch; gap: 2px;
    min-height: 58px; padding: 3px 4px; text-align: left;
    background: none; border: 1px solid var(--sumi-line);
    font-family: var(--font-data); color: var(--bone);
    cursor: pointer;
    transition: border-color var(--move-tab, 120ms);
  }
  .cal-day:hover { border-color: var(--p5-cyan); }
  .cal-num {
    align-self: flex-start;
    min-width: 17px; height: 17px; padding: 0 3px;
    line-height: 17px; text-align: center; border-radius: 50%;
    font-size: 0.64rem; color: var(--bone);
  }
  /* Today wears its number in a filled circle, Google-style - visible
     without being selected, because today matters even when you are
     browsing another day. */
  .cal-day.today .cal-num { background: var(--p5-cyan); color: var(--ink-void); }
  .cal-day.selected { border-color: var(--p5-cyan); box-shadow: inset 0 0 0 1px var(--p5-cyan); }
  .cal-day.other-month { opacity: 0.3; }
  .cal-chip {
    font-family: var(--font-body); font-size: 0.58rem; line-height: 1.35;
    padding: 1px 4px; border-left: 2px solid var(--p5-cyan);
    background: var(--ink-raised); color: var(--bone);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-chip.past { color: var(--bone-dim); border-left-color: var(--bone-dim); }
  .cal-more { font-size: 0.55rem; letter-spacing: 0.3px; color: var(--bone-dim); }
  /* The selected day's events, listed out in full under the grid - the
      chips truncate, the agenda does not. Rebuilt by the JS with the
      rest of the body on every render. */
  .cal-agenda { margin-top: 12px; flex-shrink: 0; }
  .cal-agenda-title {
    font-family: var(--font-display); font-weight: 600; font-size: 0.66rem;
    letter-spacing: 1px; text-transform: uppercase; color: var(--bone-dim);
    margin-bottom: 6px;
  }
  .cal-agenda-item {
    display: flex; align-items: baseline; gap: 8px;
    padding: 5px 8px; margin-bottom: 3px;
    background: var(--ink-raised); border-left: 2px solid var(--p5-cyan);
    font-family: var(--font-body); font-size: 0.72rem; color: var(--bone);
  }
  .cal-agenda-empty {
    padding: 5px 0; font-family: var(--font-body); font-size: 0.68rem;
    color: var(--bone-dim);
  }
  .cal-today-btn {
    padding: 4px 10px; flex-shrink: 0; background: none;
    border: 1px solid var(--sumi-line); color: var(--bone-dim);
    font-family: var(--font-display); font-weight: 600; font-size: 0.62rem; letter-spacing: 1px;
    cursor: pointer;
    transition: border-color var(--move-tab, 120ms), color var(--move-tab, 120ms);
  }
  .cal-today-btn:hover { border-color: var(--p5-cyan); color: var(--p5-cyan); }
  /* Sits BELOW #calendar-body, not inside it: the JS owns that body's
     innards and re-renders them, so this row lives where a re-render
     cannot wipe it. */
  .cal-event-add {
    display: flex; gap: 8px; flex-shrink: 0;
    padding-top: 10px; border-top: 1px solid var(--sumi-line);
  }
  .cal-event-input {
    flex: 1; min-width: 0; background: var(--ink-void);
    border: 1px solid var(--sumi-line); padding: 8px 10px;
    font-family: var(--font-body); font-size: 0.72rem; color: var(--bone);
  }
  .cal-event-input::placeholder { color: var(--bone-dim); }
  .cal-event-btn {
    padding: 8px 12px; flex-shrink: 0; background: none;
    border: 1px solid var(--sumi-line); color: var(--bone-dim);
    font-family: var(--font-display); font-weight: 600; font-size: 0.66rem; letter-spacing: 1px;
    cursor: pointer;
    transition: border-color var(--move-tab, 120ms), color var(--move-tab, 120ms);
  }
  .cal-event-btn:hover { border-color: var(--p5-cyan); color: var(--p5-cyan); }

  /* ═══════ RESPONSIVE (C9 / ADR-060) ═══════
     Above --break-tablet the sidebar is a column. Below it, the sidebar
     becomes a top bar and the nav rows lie on their side - same rows,
     same rules, just flowing sideways instead of down. */
  /* ── 1100px: a squeezed laptop ── six cards on one line need the cards
     to give up some padding before they give up the line; the chat gives
     up some width before the layout breaks, and the agents box lowers
     its floor to match. */
  @media (max-width: 1100px) {
    .stat-card { padding: 11px 12px; gap: 4px; }
    .stat-label { font-size: 0.6rem; padding-right: 18px; }
    .stat-sub { font-size: 0.62rem; }
    .usage-split { gap: 10px; }
    .usage-col .tokens { font-size: 0.6rem; }
    .chat-panel { flex-basis: 420px; }
  }

  @media (max-width: 820px) {
    .shell { flex-direction: column; }

    .sidebar {
      width: 100%; flex-direction: column; padding: 14px 0 0; border-right: none;
      border-bottom: 1px solid var(--sumi-line);
    }
    .sidebar-top { padding: 0 16px 12px; }
    .brand span { font-size: 0.9rem; }
    /* The rail is a COLUMN on a laptop, where it sits beside the chat.
       Up here it sits beside the wordmark, so it has to lie down - and
       lose the 44px width the column shape gave it. Without these two
       lines the three icons stack downwards and the header alone eats
       ~150px of a phone screen before anything has been drawn. */
    .utility-rail.mobile-only { display: flex; flex-direction: row; width: auto; }
    .utility-rail.desktop-only { display: none; }
    .util-icon { width: 32px; height: 32px; }
    .util-icon svg { width: 15px; height: 15px; }

    .nav-list { flex-direction: row; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 12px; }
    .nav-list::-webkit-scrollbar { height: 6px; }
    .nav-list::-webkit-scrollbar-thumb { background: var(--sumi-line); border-radius: 3px; }
    .nav-group { display: flex; flex-direction: row; flex-shrink: 0; }
    .nav-group + .nav-group { margin-top: 0; margin-left: 4px; }
    .nav-divider { width: 1px; height: 32px; margin: 0 8px; align-self: center; }
    .nav-row {
      flex-direction: column; flex-shrink: 0; justify-content: center;
      width: 44px; height: 44px; padding: 0; gap: 0;
      border-left: none; border-bottom: 2px solid transparent;
    }
    .nav-row.active { border-bottom-color: var(--p5-cyan); }
    .nav-label { display: none; }
    .sidebar-footer { display: none; }

    /* min-height: 0 is what lets this shrink instead of being pushed
       as tall as its contents. Without it the chat below cannot give
       any height back and the page grows past the screen. */
    .main { padding: 16px 16px 20px; gap: 14px; min-height: 0; overflow: hidden; }

    /* THE FIVE CARDS LIE DOWN AND SCROLL SIDEWAYS.
       Stacked, they are ~360px of a ~700px screen, and the chat - the
       thing you opened the page for - got what was left, which was
       nothing. As a strip they cost ~95px and you push them along with
       a thumb, the same gesture the nav row above already uses. */
    .card-row {
      display: flex;
      grid-template-columns: none;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      gap: 10px;
      padding-bottom: 4px;
    }
    .card-row::-webkit-scrollbar { height: 6px; }
    .card-row::-webkit-scrollbar-track { background: transparent; }
    .card-row::-webkit-scrollbar-thumb { background: var(--sumi-line); border-radius: 3px; }

    .stat-card {
      flex: 0 0 auto;
      width: 148px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 12px 14px;
      gap: 5px;
    }
    /* Two figures side by side need more room than one. */
    .stat-card.wide { grid-column: auto; width: 208px; }
    .stat-value { font-size: 1.1rem; }
    .usage-split { gap: 16px; }

    /* Stack instead of sit side by side: chat first, agents underneath,
       both full width and each free to shrink (min-height: 0 again). */
    .content-row { flex-direction: column; min-height: 0; }
    .chat-panel { flex: 1 1 60%; }
    .chat-card { max-width: 100%; }

    /* The floating windows become near-fullscreen sheets pinned above
       the bottom edge. Plain vh with no subtraction - the hand-measured
       calc(vh - px) shape is banned for good reason (C9). */
    .floating-window { inset: auto 12px 12px 12px; width: auto; max-height: 70vh; top: auto; right: auto; }
  }

  /* ── 560px: a phone held upright ── */
  @media (max-width: 560px) {
    .main { padding: 16px 12px; gap: 14px; }
    .chat-head { padding: 14px 16px; }
    .chat-log { padding: 16px; gap: 10px; }
    .chat-input-row { padding: 12px 14px; }
    .stat-card { padding: 12px 14px; }
    .stat-value { font-size: 1rem; }
    .accordion-head { padding: 10px 14px; }
    .agent-row { padding: 7px 14px 9px; }
    .window-body { padding: 12px 12px 14px; }
    .notes-area { padding: 12px; font-size: 0.8rem; }
  }

  /* ── 420px: the narrowest phone still sold ── */
  @media (max-width: 420px) {
    .bubble { max-width: 88%; font-size: 0.8rem; }
    .chat-input { font-size: 0.8rem; }
    .stat-label { font-size: 0.62rem; }
    .agent-name { font-size: 0.72rem; }
    .window-head { padding: 12px; }
    .window-body { padding: 10px 10px 12px; }
  }

  /* ── the same phone, turned sideways ──
     Width alone would keep the wide sidebar (a landscape phone is often
     wider than --break-tablet), and the wide layout does not fit in
     under 560px of height. This collapses it the same way, on height. */
  @media (orientation: landscape) and (max-height: 560px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: column; padding: 10px 0 0; border-right: none; border-bottom: 1px solid var(--sumi-line); }
    .sidebar-top { padding: 0 16px 8px; }
    /* Same reason as the 820px block: lying down, not stacked. */
    .utility-rail.mobile-only { display: flex; flex-direction: row; width: auto; }
    .utility-rail.desktop-only { display: none; }
    .util-icon { width: 30px; height: 30px; }
    .util-icon svg { width: 14px; height: 14px; }
    .nav-list { flex-direction: row; overflow-x: auto; padding: 0 16px 8px; }
    .nav-group { display: flex; flex-direction: row; flex-shrink: 0; }
    .nav-group + .nav-group { margin-top: 0; margin-left: 4px; }
    .nav-divider { width: 1px; height: 28px; margin: 0 8px; align-self: center; }
    .nav-row { flex-direction: column; flex-shrink: 0; width: 40px; height: 40px; padding: 0; border-left: none; border-bottom: 2px solid transparent; }
    .nav-row.active { border-bottom-color: var(--p5-cyan); }
    .nav-label { display: none; }
    .sidebar-footer { display: none; }
    .main { padding: 12px 16px 14px; gap: 10px; min-height: 0; overflow: hidden; }

    /* A strip here too, and a tighter one: there are only ~330px of
       height to divide, so the cards give up their sub-line and the
       chat keeps the rest. */
    .card-row {
      display: flex;
      grid-template-columns: none;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      gap: 8px;
      padding-bottom: 4px;
    }
    .card-row::-webkit-scrollbar { height: 5px; }
    .card-row::-webkit-scrollbar-track { background: transparent; }
    .card-row::-webkit-scrollbar-thumb { background: var(--sumi-line); border-radius: 3px; }
    .stat-card {
      flex: 0 0 auto;
      width: 132px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 8px 12px;
      gap: 3px;
    }
    .stat-card.wide { grid-column: auto; width: 190px; }
    .stat-value { font-size: 0.95rem; }
    .stat-sub { display: none; }
    .usage-split { gap: 12px; }
    .usage-col .cost { font-size: 0.85rem; }
    .usage-col .tokens { display: none; }

    /* Same stacking as the 820px block: chat above, agents below but
       capped, because lying down there is almost no height to divide. */
    .content-row { flex-direction: column; min-height: 0; }
    .chat-panel { flex: 1 1 60%; }
    .chat-card { max-width: 100%; }
    .floating-window { inset: auto 12px 10px 12px; width: auto; max-height: 60vh; top: auto; right: auto; }
    .chat-head { padding: 8px 14px; }
    .chat-mark { width: 28px; height: 28px; }
    .chat-log { padding: 12px 14px; gap: 8px; }
    .chat-input-row { padding: 8px 12px; }
  }
</style>
</head>
<body>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-top">
        <div class="brand">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l1.6 6.4L20 11l-6.4 1.6L12 19l-1.6-6.4L4 11l6.4-1.6z" fill="var(--p5-cyan)"/>
          </svg>
          <span>INKY</span>
        </div>
        <div class="utility-rail mobile-only" id="utility-rail-mobile"></div>
      </div>

      <div class="nav-list" id="nav-list">
        <div class="nav-error">Loading…</div>
      </div>

      <div class="sidebar-footer"><span>INKY.GG</span></div>
    </nav>

    <main class="main">
      <div class="brief-meta"><span class="as-of" id="brief-as-of">—</span></div>
      <div class="card-row" id="card-row">
        <div class="stat-card" id="card-assets">
          <button class="card-refresh" data-refresh="brief" aria-label="Refresh this figure">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><polyline points="20,4 20,9 15,9"/></svg>
          </button>
          <span class="stat-label">Current assets</span>
          <span class="stat-value" id="stat-assets">—</span>
          <span class="stat-sub" id="stat-assets-sub">what you own</span>
        </div>
        <div class="stat-card" id="card-liabilities">
          <button class="card-refresh" data-refresh="brief" aria-label="Refresh this figure">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><polyline points="20,4 20,9 15,9"/></svg>
          </button>
          <span class="stat-label">Current liabilities</span>
          <span class="stat-value" id="stat-liabilities">—</span>
          <span class="stat-sub" id="stat-liabilities-sub">what you owe</span>
        </div>
        <!-- Added 2026-08-22, reversing ADR-049's "menu stays clean of
             financial figures" for this one card, at the owner's
             explicit request. Computed by Finance, read off the
             noticeboard (ADR-010) - not this file's own arithmetic. -->
        <div class="stat-card" id="card-before-slice">
          <button class="card-refresh" data-refresh="brief" aria-label="Refresh this figure">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><polyline points="20,4 20,9 15,9"/></svg>
          </button>
          <span class="stat-label">Before Slice refill</span>
          <span class="stat-value" id="stat-before-slice">—</span>
          <span class="stat-sub" id="stat-before-slice-sub">bills, debt &amp; SIPs only</span>
        </div>
        <div class="stat-card wide" id="card-model-cost">
          <button class="card-refresh" data-refresh="brief" aria-label="Refresh this figure">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><polyline points="20,4 20,9 15,9"/></svg>
          </button>
          <span class="stat-label">Model cost</span>
          <div class="usage-split">
            <div class="usage-col">
              <span class="who">Inky</span>
              <span class="cost" id="cost-inky">—</span>
              <span class="tokens" id="tokens-inky">— in / — out</span>
            </div>
            <div class="usage-col">
              <span class="who">Claude Code</span>
              <span class="cost" id="cost-claude">—</span>
              <span class="tokens" id="tokens-claude">— in / — out</span>
            </div>
          </div>
        </div>
        <div class="stat-card">
          <button class="card-refresh" data-refresh="clock" aria-label="Refresh this figure">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><polyline points="20,4 20,9 15,9"/></svg>
          </button>
          <span class="stat-label">Local time</span>
          <span class="stat-value" id="local-time">—</span>
          <span class="stat-sub" id="local-date">—</span>
        </div>
      </div>

      <div class="content-row">
        <div class="chat-panel">
          <div class="chat-card">
            <div class="chat-head">
              <div class="chat-mark">
                <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 3l1.6 6.4L20 11l-6.4 1.6L12 19l-1.6-6.4L4 11l6.4-1.6z" fill="var(--ink-void)"/></svg>
              </div>
              <div class="chat-head-text">
                <span class="name">INKY</span>
                <span class="status" id="chat-status">finding where chat lives…</span>
              </div>
            </div>

            <div class="chat-log" id="chat-log">
              <div class="bubble from-inky">Hello. What can I help with?</div>
            </div>

            <div class="chat-input-row">
              <input class="chat-input" id="chat-input" type="text" placeholder="Ask Inky anything…" autocomplete="off">
              <button class="send-btn" id="send-btn" role="button" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"/><polyline points="13,6 19,12 13,18"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="utility-rail desktop-only" id="utility-rail-desktop"></div>
      </div>
    </main>
  </div>

  <!-- FLOATING WINDOWS - opened by home_windows.js via the utility rail's
       data-window attributes. This file ships only the shells and their
       styles; every open/close/render decision lives in that file. -->
  <div class="window-overlay" id="window-overlay" hidden></div>

  <section class="floating-window" id="calendar-window" hidden role="dialog" aria-modal="true" aria-label="Calendar">
    <header class="window-head">
      <span class="window-title">CALENDAR</span>
      <button class="window-close" data-close aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </header>
    <div class="window-body" id="calendar-body"></div>
    <!-- Event-add row sits below the grid, outside the body the JS
         re-renders, so adding an event can't wipe the month away. -->
    <div class="cal-event-add">
      <input class="cal-event-input" id="cal-event-title" type="text" placeholder="Event on the selected day…" autocomplete="off">
      <button class="cal-event-btn" id="cal-event-add" type="button">ADD</button>
    </div>
  </section>

  <section class="floating-window" id="notes-window" hidden role="dialog" aria-modal="true" aria-label="Notes">
    <header class="window-head">
      <span class="window-title">NOTES</span>
      <button class="window-close" data-close aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </header>
    <div class="window-body notes-body">
      <textarea class="notes-area" id="notes-textarea" placeholder="Write it here. It stays." spellcheck="false"></textarea>
      <div class="notes-foot">
        <span class="notes-hint" id="notes-status">saved just now</span>
        <button class="notes-clear" id="notes-clear" type="button">CLEAR</button>
      </div>
    </div>
  </section>

  <!-- The windows script above the inline block - it depends only on the
       DOM, and the inline block below stays last so it can rely on it.
       (The old home_data.js and home_agents_box.js were removed with the
       agent layer they read from; nothing else on this page used them.) -->
  <script src="/page/js/home_windows.js"></script>
  <script>
    // ------------------------------------------------------------------
    //  ICONS - one small line-icon set, keyed by screen name. Anything
    //  the menu does not recognise gets DEFAULT_ICON rather than nothing,
    //  so a screen added tomorrow still shows up looking finished.
    // ------------------------------------------------------------------
    const ICONS = {
      home: '<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h5v-5h2v5h5V10.5"/>',
      finance: '<line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="13" width="3" height="7"/><rect x="11" y="9" width="3" height="11"/><rect x="16" y="5" width="3" height="15"/>',
      learning: '<path d="M4 6c2-1.5 5-1.5 8 0v13c-3-1.5-6-1.5-8 0V6z"/><path d="M20 6c-2-1.5-5-1.5-8 0v13c3-1.5 6-1.5 8 0V6z"/>',
      models: '<rect x="7" y="7" width="10" height="10" rx="1"/><rect x="10" y="10" width="4" height="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>',
      enhancement: '<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.8 1 .8 1.7v.5h5.6v-.5c0-.7.3-1.3.8-1.7A6 6 0 0 0 12 3z"/>',
      investments: '<polyline points="4,17 10,11 14,15 20,7"/><polyline points="15,7 20,7 20,12"/>',
      job_hunt: '<rect x="4" y="8" width="16" height="11" rx="1"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><line x1="4" y1="13" x2="20" y2="13"/>',
    };
    const DEFAULT_ICON = '<rect x="7" y="7" width="10" height="10"/>';

    const UTILITY_ICONS = [
      '<rect x="4" y="6" width="16" height="14" rx="1"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8" y1="4" x2="8" y2="8"/><line x1="16" y1="4" x2="16" y2="8"/>',
      '<rect x="6" y="4" width="12" height="16" rx="1"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/>',
      '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
      '<path d="M20 12a8 8 0 1 1-2.6-5.9"/><polyline points="20,4 20,9 15,9"/>',
    ];

    function iconSvg(paths, stroke) {
      return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
    }

    function navRow({ key, label, address, active, unavailable }) {
      const cls = ['nav-row'];
      if (active) cls.push('active');
      if (unavailable) cls.push('unavailable');
      const stroke = active ? 'var(--bone)' : 'var(--bone-dim)';

      const el = document.createElement(address ? 'a' : 'div');
      if (address) {
        el.href = address;
        el.setAttribute('role', 'button');
      }
      el.className = cls.join(' ');
      el.innerHTML = `<span class="nav-icon">${iconSvg(ICONS[key] || DEFAULT_ICON, stroke)}</span><span class="nav-label">${label}</span>`;
      return el;
    }

    // What the navigation call found - the sidebar is drawn from it,
    // and the chat box reads it to say where questions can be answered.
    let builtScreens = [];

    async function loadNavigation() {
      const list = document.getElementById('nav-list');
      list.innerHTML = '';

      const homeGroup = document.createElement('div');
      homeGroup.className = 'nav-group';
      homeGroup.appendChild(navRow({ key: 'home', label: 'HOME', address: null, active: true }));
      list.appendChild(homeGroup);

      let data;
      try {
        const res = await fetch('/api/main_menu/navigation');
        if (!res.ok) throw new Error('answered ' + res.status);
        data = await res.json();
      } catch (err) {
        const errRow = document.createElement('div');
        errRow.className = 'nav-error';
        errRow.textContent = 'Could not reach this screen’s own server (' + err.message + ').';
        list.appendChild(errRow);
        return;
      }

      // Kept for anything else on the page that needs to know what is
      // built - right now, the chat box's honest "ask over there" reply.
      builtScreens = data.screens || [];
      updateChatStatus();

      const builtGroup = document.createElement('div');
      builtGroup.className = 'nav-group';
      data.screens
        .slice()
        .sort((a, b) => a.order - b.order)
        .forEach(s => {
          builtGroup.appendChild(navRow({ key: s.key, label: s.label, address: s.address }));
        });
      list.appendChild(builtGroup);

      if (data.not_built.length) {
        const divider = document.createElement('div');
        divider.className = 'nav-divider';
        list.appendChild(divider);

        const notBuiltGroup = document.createElement('div');
        notBuiltGroup.className = 'nav-group';
        data.not_built.forEach(s => {
          notBuiltGroup.appendChild(navRow({ key: s.key, label: s.label, unavailable: true }));
        });
        list.appendChild(notBuiltGroup);
      }
    }

    // The rail is built from UTILITY_ICONS. The first two have somewhere
    // to go - data-window names the floating window home_windows.js opens
    // when the button is clicked (the open/close logic itself is that
    // file's job). The third has no source behind it yet, so it stays an
    // honest ghost: no data-window, reduced opacity, a title that says
    // why (C12).
    const UTIL_WINDOW_TARGETS = ['calendar-window', 'notes-window', null, null];
    const UTIL_WINDOW_LABELS = ['Calendar', 'Notes', 'Notifications', 'Restart INKY'];
    const UTIL_ACTIONS = [null, null, null, 'restart'];

    function renderUtilityRail(elementId) {
      const rail = document.getElementById(elementId);
      UTILITY_ICONS.forEach((paths, i) => {
        const btn = document.createElement('button');
        btn.className = 'util-icon';
        const target = UTIL_WINDOW_TARGETS[i];
        const action = UTIL_ACTIONS[i];
        if (target) {
          btn.dataset.window = target;
          btn.setAttribute('aria-haspopup', 'dialog');
        } else if (action) {
          btn.dataset.action = action;
          btn.title = 'clear every fetched-data cache and restart every screen';
        } else {
          btn.title = 'notifications have no source yet';
        }
        btn.setAttribute('aria-label', UTIL_WINDOW_LABELS[i]);
        btn.innerHTML = iconSvg(paths, 'var(--bone-dim)');
        rail.appendChild(btn);
      });
    }
    renderUtilityRail('utility-rail-desktop');
    renderUtilityRail('utility-rail-mobile');

    // ------------------------------------------------------------------
    //  TOP CARDS - real noticeboard figures, never a guess. A blank
    //  value from the server prints as the dash it already is.
    // ------------------------------------------------------------------
    // Every "brief" card is backed by the one noticeboard read, so one
    // in-flight guard and one set of spinning icons covers all of them -
    // clicking any refresh button refreshes every noticeboard-backed
    // card, honestly, because that is genuinely what is behind each one.
    let briefInFlight = false;

    function setBriefSpinning(on) {
      document.querySelectorAll('[data-refresh="brief"]').forEach(btn => {
        btn.classList.toggle('spinning', on);
        btn.disabled = on;
      });
    }

    async function refreshHomeBrief() {
      if (briefInFlight) return;
      briefInFlight = true;
      setBriefSpinning(true);

      let data;
      try {
        const res = await fetch('/api/main_menu/home_brief');
        if (!res.ok) throw new Error('answered ' + res.status);
        data = await res.json();
      } catch (err) {
        return; // cards stay at whatever they last showed
      } finally {
        briefInFlight = false;
        setBriefSpinning(false);
      }

      const assetsEl = document.getElementById('stat-assets');
      assetsEl.textContent = data.total_assets.display;
      assetsEl.classList.toggle('dim', data.total_assets.amount === null);
      document.getElementById('stat-assets-sub').textContent =
        data.total_assets.amount === null ? 'not tracked yet' : 'what you own';

      const liabilitiesEl = document.getElementById('stat-liabilities');
      liabilitiesEl.textContent = data.total_liabilities.display;
      liabilitiesEl.classList.toggle('dim', data.total_liabilities.amount === null);
      document.getElementById('stat-liabilities-sub').textContent =
        data.total_liabilities.amount === null ? 'not tracked yet' : 'what you owe';

      const beforeSliceEl = document.getElementById('stat-before-slice');
      beforeSliceEl.textContent = data.before_slice_refill.display;
      beforeSliceEl.classList.toggle('dim', data.before_slice_refill.amount === null);
      document.getElementById('stat-before-slice-sub').textContent =
        data.before_slice_refill.amount === null ? 'not tracked yet' : 'bills, debt & SIPs only';

      document.getElementById('cost-inky').textContent = data.inky_usage.cost_display;
      document.getElementById('tokens-inky').textContent =
        data.inky_usage.input_display + ' in / ' + data.inky_usage.output_display + ' out';

      document.getElementById('cost-claude').textContent = data.claude_code_usage.cost_display;
      document.getElementById('tokens-claude').textContent =
        data.claude_code_usage.input_display + ' in / ' + data.claude_code_usage.output_display + ' out';

      // Rule 6: a number's age has to be visible. This is when the
      // noticeboard was actually read, not when Finance or Models last
      // computed it - the noticeboard itself is only as fresh as the
      // last time one of those screens was opened.
      document.getElementById('brief-as-of').textContent =
        'AS OF ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    // ------------------------------------------------------------------
    //  LOCAL TIME - the device's own clock, ticking. No calendar is
    //  connected, so this shows the time and nothing else - never an
    //  invented "next event" (C12).
    // ------------------------------------------------------------------
    function tickLocalClock() {
      const now = new Date();
      document.getElementById('local-time').textContent =
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('local-date').textContent =
        now.toLocaleDateString([], { weekday: 'short', day: '2-digit', month: 'short' });
    }

    // ------------------------------------------------------------------
    //  CHAT - a real UI, an honest answer. The menu has no line of its
    //  own to the model router (forwarding a question would be doing
    //  another screen's job), so instead of claiming no model exists it
    //  points at where chat actually works - found from the same
    //  navigation data that drew the sidebar, never typed in here (C12).
    // ------------------------------------------------------------------
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Where can a question actually be answered? Whichever built screen
    // declares a tab keyed "chat" - looked up in the same navigation
    // payload that drew the sidebar, so the reply stays true if screens
    // are added or renamed. Nothing here names a screen.
    function chatHosts() {
      return builtScreens.filter(s => (s.tabs || []).some(t => t.key === 'chat'));
    }

    function updateChatStatus() {
      const el = document.getElementById('chat-status');
      if (!el) return;
      const hosts = chatHosts();
      el.textContent = hosts.length
        ? 'chat lives on the ' + hosts.map(s => s.label).join(' and ') + ' screen'
        : 'no screen offers chat yet';
    }

    function chatReplyText() {
      const hosts = chatHosts();
      if (!hosts.length) {
        return "No screen offers chat yet, so there is nowhere to send this.";
      }
      return "This menu box isn't wired to INKY's model router yet - but INKY "
           + "does answer questions today, over on the "
           + hosts.map(s => s.label).join(" and ")
           + " screen's Chat tab.";
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const log = document.getElementById('chat-log');

      const you = document.createElement('div');
      you.className = 'bubble from-you';
      you.innerHTML = escapeHtml(text);
      log.appendChild(you);

      const reply = document.createElement('div');
      reply.className = 'bubble from-inky';
      reply.textContent = chatReplyText();
      log.appendChild(reply);

      input.value = '';
      log.scrollTop = log.scrollHeight;
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    document.querySelectorAll('[data-refresh="brief"]').forEach(btn => {
      btn.addEventListener('click', refreshHomeBrief);
    });
    // The clock ticks on its own every second; the icon is here for the
    // same reason it's on every other card, and gives an honest instant
    // re-tick rather than doing nothing until the next second turns over.
    document.querySelectorAll('[data-refresh="clock"]').forEach(btn => {
      btn.addEventListener('click', () => {
        tickLocalClock();
        btn.classList.add('spinning');
        setTimeout(() => btn.classList.remove('spinning'), 400);
      });
    });

    // ------------------------------------------------------------------
    //  RESTART INKY - clears every screen's fetched-data cache and asks
    //  the launcher to restart every screen it owns, then waits for this
    //  menu to answer again before reloading. Two clicks, not a native
    //  confirm() dialog: the first arms the button (red, Rule 8 - a
    //  colour that means act, not decoration) for 4 seconds, the second
    //  actually sends it. Every branch below says plainly what happened,
    //  never a spinner that quietly gives up (C12).
    // ------------------------------------------------------------------
    async function waitForMenuToComeBack(timeoutMs) {
      const deadline = Date.now() + timeoutMs;
      while (Date.now() < deadline) {
        try {
          const res = await fetch('/api/main_menu/navigation', { cache: 'no-store' });
          if (res.ok) return true;
        } catch (err) { /* old process dying or new one not bound yet - keep trying */ }
        await new Promise(r => setTimeout(r, 500));
      }
      return false;
    }

    async function restartInky(btn) {
      btn.disabled = true;
      btn.classList.add('spinning');
      btn.title = 'restarting…';

      let requested = false;
      try {
        const res = await fetch('/api/main_menu/restart', { method: 'POST' });
        if (!res.ok) throw new Error('answered ' + res.status);
        const data = await res.json();
        requested = !!data.restart_requested;
        btn.title = requested
          ? 'restarting - waiting for it to come back…'
          : 'restart could not be requested';
      } catch (err) {
        btn.title = 'restart failed: ' + err.message;
        btn.disabled = false;
        btn.classList.remove('spinning');
        return;
      }

      const back = await waitForMenuToComeBack(30000);
      if (back) {
        location.reload();
        return;
      }
      btn.title = 'did not come back within 30s - check the terminal '
        + '(a screen started on its own does not auto-restart)';
      btn.disabled = false;
      btn.classList.remove('spinning');
    }

    let restartArmed = false;
    document.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-action="restart"]');
      if (!btn) return;

      if (!restartArmed) {
        restartArmed = true;
        btn.classList.add('armed');
        btn.title = 'click again to confirm: clears every fetched-data cache and restarts every screen';
        setTimeout(() => {
          restartArmed = false;
          btn.classList.remove('armed');
          btn.title = 'clear every fetched-data cache and restart every screen';
        }, 4000);
        return;
      }

      restartArmed = false;
      btn.classList.remove('armed');
      restartInky(btn);
    });

    loadNavigation();
    refreshHomeBrief();
    tickLocalClock();
    setInterval(tickLocalClock, 1000);
  </script>
<script>window.INKY_TRACE = { actor: 'main_menu', api: '/api/main_menu' };</script>
<script src="/shared/page_tracer.js" defer></script>
<script src="/shared/auto_refresh_watch.js" defer></script>
  <script src="/shared/block_guards.js" defer></script>
