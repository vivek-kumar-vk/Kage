# =====================================================================
# Kage's local LiteLLM gateway - model routing + fallback.
#
# This file is COMMITTED and carries no secrets: every api_key is an
# os.environ/<VAR> reference, resolved from .env at start-up. A model
# whose key is unset still loads - it just reports unhealthy until you
# paste a real key into .env and restart (wayfinder ticket T5).
#
# Edit the model_list to match the providers you actually use. The
# names on the left (model_name) are what callers ask for; the
# litellm_params.model on the right is the real provider + model id.
# =====================================================================

model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # Fully local, no key. Every model Ollama has - now and whatever you
  # `ollama pull` later - is reachable through these two wildcard
  # entries; nothing to re-list. Use the `ollama_chat/<name>` form for
  # chat models (correct multi-turn + thinking-tag handling); `ollama/`
  # stays for the /generate endpoint and embeddings.
  - model_name: "ollama_chat/*"
    litellm_params:
      model: "ollama_chat/*"
      api_base: http://127.0.0.1:11434
  - model_name: "ollama/*"
    litellm_params:
      model: "ollama/*"
      api_base: http://127.0.0.1:11434

  # The three currently-installed ones, named so they show up in the UI
  # model list and the Test page. Add a line here when you pull a new
  # one you want listed (the wildcards above already make it callable).
  - model_name: qwen3:8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://127.0.0.1:11434
  - model_name: moondream
    litellm_params:
      model: ollama_chat/moondream:latest
      api_base: http://127.0.0.1:11434
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text:latest
      api_base: http://127.0.0.1:11434

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  # Strongest first, then cheaper / local rungs.
  fallbacks:
    - claude-sonnet: ["gpt-4o", "qwen3:8b"]
    - gpt-4o: ["qwen3:8b"]

litellm_settings:
  # Silently drop provider-specific params a given model does not accept,
  # so one caller shape works across every rung of a fallback chain.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Keep models/keys/teams added through the UI in Postgres, not just
  # this file.
  store_model_in_db: true
