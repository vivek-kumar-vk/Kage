<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INKY.GG — Finance</title>

<!-- The shared INKY contract (breakpoints, tap targets, safe areas) and
     this screen's own glass look, split out so a UI change is a small
     file to open. -->
<link rel="stylesheet" href="/page/css/style_for_finance.css">
<!-- An inline rupee icon: without it every visit logs a /favicon.ico
     404 in the console - noise that hides real failures. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23b5e8ee'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' fill='%231e2959' font-family='sans-serif' font-weight='700'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <!-- ═══════ TOP BAR ═══════ -->
  <div class="top-bar">
    <div class="brand">
      <span class="brand-mark"><i class="ph ph-currency-inr"></i></span>
      FINANCE
    </div>
    <div class="clock">
      <b id="clock-time">—</b><br>
      <span id="clock-date">—</span>
    </div>
    <a class="back-to-menu" href="/">&#8592; Back to Menu</a>
  </div>

  <div class="app-body">

    <!-- ═══════ SIDEBAR ═══════ -->
    <nav class="sidebar glass-panel">
      <button class="side-tab active" data-tab="overview"><i class="ph ph-squares-four"></i><span>Overview<span class="sub">surplus, gates, buffer</span></span></button>
      <button class="side-tab" data-tab="investments"><i class="ph ph-chart-line-up"></i><span>Investments<span class="sub">what I hold, NAVs</span></span></button>
      <button class="side-tab" data-tab="portfolio"><i class="ph ph-chart-pie-slice"></i><span>Portfolio Analysis<span class="sub">overlap, concentration</span></span></button>
      <button class="side-tab" data-tab="debt"><i class="ph ph-hand-coins"></i><span>Debt &amp; Liabilities<span class="sub">loans, EMI, insurance</span></span></button>
    </nav>

    <main class="content">

      <!-- ═══════ OVERVIEW ═══════ -->
      <section class="tab-pane active" id="pane-overview">
        <div id="overview-score"></div>

        <div class="widget-grid">
          <!-- Two independent columns, each its own flow: the gates
               panel and the payoff countdowns are siblings inside
               .area-side, so the countdowns sit directly under the
               gates with only the normal gap - a tall gate row can
               never push them down and leave a hole (the old
               grid-template-areas layout aligned rows across columns,
               which is exactly where the gap came from). -->
          <div class="area-side">
            <div class="area-gates glass-panel panel-pad">
              <div class="panel-title"><i class="ph ph-door"></i>The four gates
                <span class="kpi-sub" style="margin-left:auto">hover a row for what it asks</span></div>
              <div id="gates-list"></div>
            </div>

            <div class="area-countdowns">
              <div class="glass-panel countdown-card" id="countdown-personal"></div>
              <div class="glass-panel countdown-card" id="countdown-loan"></div>
            </div>
          </div>

          <div class="area-main">
            <div class="kpi-row" id="overview-cards">
              <div class="glass-panel kpi-card" id="kpi-surplus"></div>
              <div class="glass-panel kpi-card" id="kpi-buffer"></div>
              <div class="glass-panel kpi-card" id="kpi-portfolio"></div>
            </div>

            <div class="area-money glass-panel panel-pad">
              <div class="panel-title"><i class="ph ph-flow-arrow"></i>Where the money goes
                <span class="kpi-sub" style="margin-left:auto">waves beside each row are decoration, not history</span></div>
              <div id="money-list"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ═══════ INVESTMENTS ═══════ -->
      <section class="tab-pane" id="pane-investments">
        <div id="investments-body"></div>
      </section>

      <!-- ═══════ PORTFOLIO ANALYSIS ═══════ -->
      <section class="tab-pane" id="pane-portfolio">
        <div id="portfolio-body"></div>
      </section>

      <!-- ═══════ DEBT & LIABILITIES ═══════ -->
      <section class="tab-pane" id="pane-debt">
        <div id="debt-body"></div>
      </section>

    </main>
  </div>

<!-- Apache ECharts, vendored locally (C1 - the dashboard must render
     without internet). Loaded before this screen's script so echarts is
     defined everywhere below uses it. -->
<script src="/page/js/vendor/echarts.min.js?v=1"></script>
<script src="/page/js/script_for_finance.js?v=2"></script>
<script>window.INKY_TRACE = { actor: 'finance', api: '/api/finance' };</script>
<script src="/shared/page_tracer.js"></script>
<script src="/shared/auto_refresh_watch.js"></script>
  <script src="/shared/block_guards.js" defer></script>
</body>
</html>
