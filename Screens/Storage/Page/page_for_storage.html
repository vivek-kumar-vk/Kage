<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storage — Kage</title>
<style>
  :root { --bg:#0b0d10; --panel:#12161b; --line:#232a33; --ink:#dfe6ee;
          --dim:#8b98a8; --ok:#57d9a3; --bad:#ff6b6b; --amber:#e8a851; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink);
              font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header b { letter-spacing:.14em; font-weight:600; color:var(--amber); }
  a { color:var(--dim); text-decoration:none; }
  a:hover { color:var(--ink); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .spacer { flex:1; }
  main { max-width:760px; margin:32px auto; padding:0 16px; display:flex;
         flex-direction:column; gap:16px; }
  .panel { border:1px solid var(--line); border-radius:10px; background:var(--panel);
           padding:18px 20px; }
  .panel h3 { margin:0 0 12px; font-size:12px; letter-spacing:.14em; color:var(--amber);
              font-weight:600; display:flex; align-items:center; gap:10px; }
  .row { display:flex; gap:10px; padding:4px 0; }
  .row span:first-child { color:var(--dim); min-width:150px; }
  .row span.bad { color:var(--bad); }
  .placeholder { color:var(--dim); font-style:italic; }
  .search { display:flex; gap:8px; margin-bottom:12px; }
  .search input { flex:1; background:var(--bg); border:1px solid var(--line);
                  border-radius:6px; color:var(--ink); padding:8px 10px;
                  font:inherit; }
  .search button { background:var(--amber); color:#1a1206; border:0; border-radius:6px;
                    padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; }
  .hit { border-top:1px solid var(--line); padding:8px 0; font-size:12.5px; }
  .hit:first-child { border-top:0; }
  .hit .path { color:var(--amber); }
  .hit .text { color:var(--dim); margin-top:3px; }
  .tag { font-size:10px; padding:2px 8px; border-radius:999px; border:1px solid var(--line);
         color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .tag.dim { opacity:.7; }
  .ledger-row { display:flex; gap:10px; padding:5px 0; border-top:1px solid var(--line);
                font-size:12.5px; }
  .ledger-row:first-child { border-top:0; }
  .ledger-row .when { color:var(--dim); min-width:130px; }
</style>

<header>
  <b>STORAGE</b>
  <span class="dot" id="dot"></span>
  <span id="state">checking…</span>
  <span class="spacer"></span>
  <a href="http://127.0.0.1:8000/">← Main Menu</a>
</header>

<main>
  <section class="panel">
    <h3>STORE</h3>
    <div id="store"></div>
  </section>

  <section class="panel">
    <h3>KNOWLEDGE <span id="knowledge-count" class="tag dim"></span></h3>
    <div class="search">
      <input id="q" type="text" placeholder="hybrid search…"
             onkeydown="if(event.key==='Enter') runSearch()">
      <button onclick="runSearch()">SEARCH</button>
    </div>
    <div id="knowledge-state" class="placeholder"></div>
    <div id="results"></div>
  </section>

  <section class="panel">
    <h3>EMBEDDINGS</h3>
    <div id="embeddings"></div>
  </section>

  <section class="panel">
    <h3>TRADER LEDGER <span id="trader-count" class="tag dim"></span></h3>
    <div id="trader"></div>
  </section>
</main>

<script>
function row(label, value, bad) {
  return `<div class="row"><span>${label}</span>` +
         `<span class="${bad ? 'bad' : ''}">${value}</span></div>`;
}

async function checkStore() {
  const dot = document.getElementById('dot');
  const state = document.getElementById('state');
  let info;
  try {
    info = await (await fetch('/api/storage/status')).json();
  } catch (e) {
    info = { state: 'error', problem: String(e) };
  }
  const ok = info.state === 'ok';
  dot.className = ok ? 'dot ok' : 'dot bad';
  state.textContent = ok ? 'reachable' : (info.problem || 'unreachable');

  let html = '';
  html += row('data dir', info.data_dir || '—');
  html += row('documents', info.doc_count ?? '—');
  html += row('free space', info.free_bytes != null
    ? `${(info.free_bytes / 1e9).toFixed(1)} GB` : '—');
  if (!ok) html += row('problem', info.problem || 'unreachable', true);
  document.getElementById('store').innerHTML = html;
}

async function checkKnowledge() {
  let notes;
  try {
    notes = await (await fetch('/api/storage/knowledge/notes')).json();
  } catch (e) {
    notes = { state: 'error', notes: [] };
  }
  const count = (notes.notes || []).length;
  document.getElementById('knowledge-count').textContent = `${count} note${count === 1 ? '' : 's'}`;
  document.getElementById('knowledge-state').textContent = count === 0
    ? 'No notes yet.' : '';
}

async function runSearch() {
  const q = document.getElementById('q').value.trim();
  const resultsEl = document.getElementById('results');
  const stateEl = document.getElementById('knowledge-state');
  if (!q) { resultsEl.innerHTML = ''; stateEl.textContent = ''; return; }

  let data;
  try {
    data = await (await fetch(`/api/storage/knowledge/search?q=${encodeURIComponent(q)}`)).json();
  } catch (e) {
    stateEl.textContent = `search failed: ${e}`;
    resultsEl.innerHTML = '';
    return;
  }
  stateEl.textContent = data.note || (data.state === 'partial' ? 'partial results' : '');
  const hits = data.results || [];
  resultsEl.innerHTML = hits.length === 0
    ? '<p class="placeholder">No matches.</p>'
    : hits.map(h => `<div class="hit"><div class="path">${h.doc_path}</div>` +
        `<div class="text">${h.text.slice(0, 200)}${h.text.length > 200 ? '…' : ''}</div></div>`
      ).join('');
}

async function checkEmbeddings() {
  let info;
  try {
    info = await (await fetch('/api/storage/embeddings/status')).json();
  } catch (e) {
    info = { state: 'error', problem: String(e), gateway: '', model: null };
  }
  const ok = info.state === 'ok';
  let html = '';
  html += row('gateway', info.gateway || '—');
  html += row('model', info.model || '(none configured)', !info.model);
  if (!ok) html += row('problem', info.problem || 'unreachable', true);
  document.getElementById('embeddings').innerHTML = html;
}

async function checkTrader() {
  let data;
  try {
    data = await (await fetch('/api/storage/trader/decisions?limit=10')).json();
  } catch (e) {
    data = { decisions: [] };
  }
  const decisions = data.decisions || [];
  document.getElementById('trader-count').textContent =
    `${decisions.length} recent`;
  document.getElementById('trader').innerHTML = decisions.length === 0
    ? '<p class="placeholder">No decisions logged yet — the trader agent itself is unbuilt; this is only its ledger.</p>'
    : decisions.map(d => `<div class="ledger-row"><span class="when">${d.recorded_at || d.path}</span>` +
        `<span>${d.symbol || ''} ${d.action || ''} ${d.thesis || ''}</span></div>`
      ).join('');
}

function refreshAll() {
  checkStore();
  checkKnowledge();
  checkEmbeddings();
  checkTrader();
}
refreshAll();
setInterval(refreshAll, 15000);
</script>
