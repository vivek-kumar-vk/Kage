<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storage — Kage</title>
<style>
  :root { --bg:#0b0d10; --panel:#12161b; --line:#232a33; --ink:#dfe6ee;
          --dim:#8b98a8; --ok:#57d9a3; --bad:#ff6b6b; --amber:#e8a851; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink);
              font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header b { letter-spacing:.14em; font-weight:600; color:var(--amber); }
  a { color:var(--dim); text-decoration:none; }
  a:hover { color:var(--ink); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .spacer { flex:1; }
  main { max-width:760px; margin:32px auto; padding:0 16px; display:flex;
         flex-direction:column; gap:16px; }
  .panel { border:1px solid var(--line); border-radius:10px; background:var(--panel);
           padding:18px 20px; }
  .panel h3 { margin:0 0 12px; font-size:12px; letter-spacing:.14em; color:var(--amber);
              font-weight:600; display:flex; align-items:center; gap:10px; }
  .row { display:flex; gap:10px; padding:4px 0; }
  .row span:first-child { color:var(--dim); min-width:150px; }
  .row span.bad { color:var(--bad); }
  .placeholder { color:var(--dim); font-style:italic; }
  .search { display:flex; gap:8px; margin-bottom:12px; }
  .search input { flex:1; background:var(--bg); border:1px solid var(--line);
                  border-radius:6px; color:var(--ink); padding:8px 10px;
                  font:inherit; }
  .search button { background:var(--amber); color:#1a1206; border:0; border-radius:6px;
                    padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; }
  .hit { border-top:1px solid var(--line); padding:8px 0; font-size:12.5px; }
  .hit:first-child { border-top:0; }
  .hit .path { color:var(--amber); }
  .hit .text { color:var(--dim); margin-top:3px; }
  .tag { font-size:10px; padding:2px 8px; border-radius:999px; border:1px solid var(--line);
         color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .tag.dim { opacity:.7; }
  .ledger-row { display:flex; gap:10px; padding:5px 0; border-top:1px solid var(--line);
                font-size:12.5px; }
  .ledger-row:first-child { border-top:0; }
  .ledger-row .when { color:var(--dim); min-width:130px; }
  .bad { color:var(--bad); }

  /* B-04 — structure trigger cards + drawers */
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:640px) { .cards { grid-template-columns:1fr; } }
  .card { border:1px solid var(--line); border-radius:10px; background:var(--bg);
          padding:14px 16px; text-align:left; color:var(--ink); font:inherit;
          cursor:pointer; display:flex; flex-direction:column; gap:6px; }
  .card:hover { border-color:var(--amber); }
  .card .t { font-size:12px; letter-spacing:.14em; color:var(--amber); font-weight:600; }
  .card .s { color:var(--dim); font-size:12.5px; }
  .card .age { color:var(--dim); font-size:11px; }
  .card .age.stale { color:var(--amber); }

  dialog.drawer { border:1px solid var(--line); border-radius:12px; background:var(--panel);
                  color:var(--ink); width:calc(100% - 32px); max-width:900px;
                  max-height:calc(100% - 64px); padding:0; }
  dialog.drawer::backdrop { background:rgba(4,6,8,.66); }
  @media (prefers-reduced-motion: no-preference) {
    dialog.drawer[open] { animation:drawer-in .18s ease-out; }
    @keyframes drawer-in { from { transform:translateY(12px); opacity:0; } to { transform:none; opacity:1; } }
  }
  .drawer-head { display:flex; align-items:center; gap:12px; padding:14px 18px;
                 border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
  .drawer-head .t { font-size:12px; letter-spacing:.14em; color:var(--amber); font-weight:600; }
  .drawer-head .gen { color:var(--dim); font-size:11px; }
  .drawer-head .gen.stale { color:var(--amber); }
  .drawer-head button { margin-left:auto; background:none; border:1px solid var(--line);
                        color:var(--dim); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  .drawer-body { padding:16px 18px; overflow:auto; }
  .drawer-body h4 { color:var(--amber); margin:14px 0 6px; font-size:12px; letter-spacing:.1em; }
  .drawer-body h4:first-child { margin-top:0; }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:720px) { .two-col { grid-template-columns:1fr; } }
  details.tree-node { padding:2px 0; }
  details.tree-node > summary { cursor:pointer; }
  .sub { color:var(--dim); padding-left:16px; font-size:12.5px; }
  .bmap-group { margin-bottom:10px; }
  .bmap-group > .from { color:var(--amber); font-size:12px; margin-bottom:3px; }
  .bmap-row { padding:2px 0; font-size:12.5px; color:var(--dim); word-break:break-all; }
  .bmap-row.viol { color:var(--bad); }
  .via { font-size:10px; padding:1px 6px; border-radius:999px; border:1px solid var(--line);
         text-transform:uppercase; letter-spacing:.05em; }
  .via.http { color:var(--amber); border-color:var(--amber); }
  .via.import { color:var(--dim); }
  .dot-list { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .agent-dot { border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; }
  .agent-dot .tier { color:var(--dim); font-size:10px; text-transform:uppercase; }
  details.acc { border:1px solid var(--line); border-radius:8px; margin-bottom:8px; padding:8px 12px; }
  details.acc > summary { cursor:pointer; }
  table.schema { border-collapse:collapse; width:100%; font-size:12px; margin:4px 0; }
  table.schema th, table.schema td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  table.schema th { color:var(--amber); font-weight:600; }
  .muted { color:var(--dim); font-style:italic; }
  .regen { background:var(--amber); color:#1a1206; border:0; border-radius:6px;
           padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; margin-top:8px; }
</style>

<header>
  <b>STORAGE</b>
  <span class="dot" id="dot"></span>
  <span id="state">checking…</span>
  <span class="spacer"></span>
  <a href="http://127.0.0.1:8000/">← Main Menu</a>
</header>

<main>
  <section class="panel">
    <h3>STORE</h3>
    <div id="store"></div>
  </section>

  <section class="panel">
    <h3>STRUCTURE</h3>
    <div class="cards">
      <button class="card" type="button" onclick="openDrawer('code')">
        <span class="t">CODE STRUCTURE</span>
        <span class="s" id="sum-code">…</span>
        <span class="age" id="age-code"></span>
      </button>
      <button class="card" type="button" onclick="openDrawer('agents')">
        <span class="t">AGENT TREE</span>
        <span class="s" id="sum-agents">…</span>
        <span class="age" id="age-agents"></span>
      </button>
      <button class="card" type="button" onclick="openDrawer('data')">
        <span class="t">KAGE DATA SCHEMA</span>
        <span class="s" id="sum-data">…</span>
        <span class="age" id="age-data"></span>
      </button>
    </div>
  </section>

  <section class="panel">
    <h3>KNOWLEDGE <span id="knowledge-count" class="tag dim"></span></h3>
    <div class="search">
      <input id="q" type="text" placeholder="hybrid search…"
             onkeydown="if(event.key==='Enter') runSearch()">
      <button onclick="runSearch()">SEARCH</button>
    </div>
    <div id="knowledge-state" class="placeholder"></div>
    <div id="results"></div>
  </section>

  <section class="panel">
    <h3>EMBEDDINGS</h3>
    <div id="embeddings"></div>
  </section>

  <section class="panel">
    <h3>TRADER LEDGER <span id="trader-count" class="tag dim"></span></h3>
    <div id="trader"></div>
  </section>
</main>

<dialog class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="t" id="drawer-title"></span>
    <span class="gen" id="drawer-gen"></span>
    <button type="button" onclick="document.getElementById('drawer').close()">Esc ✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</dialog>

<script>
function row(label, value, bad) {
  return `<div class="row"><span>${label}</span>` +
         `<span class="${bad ? 'bad' : ''}">${value}</span></div>`;
}

async function checkStore() {
  const dot = document.getElementById('dot');
  const state = document.getElementById('state');
  let info;
  try {
    info = await (await fetch('/api/storage/status')).json();
  } catch (e) {
    info = { state: 'error', problem: String(e) };
  }
  const ok = info.state === 'ok';
  dot.className = ok ? 'dot ok' : 'dot bad';
  state.textContent = ok ? 'reachable' : (info.problem || 'unreachable');

  let html = '';
  html += row('data dir', info.data_dir || '—');
  html += row('documents', info.doc_count ?? '—');
  html += row('free space', info.free_bytes != null
    ? `${(info.free_bytes / 1e9).toFixed(1)} GB` : '—');
  if (!ok) html += row('problem', info.problem || 'unreachable', true);
  document.getElementById('store').innerHTML = html;
}

async function checkKnowledge() {
  let notes;
  try {
    notes = await (await fetch('/api/storage/knowledge/notes')).json();
  } catch (e) {
    notes = { state: 'error', notes: [] };
  }
  const count = (notes.notes || []).length;
  document.getElementById('knowledge-count').textContent = `${count} note${count === 1 ? '' : 's'}`;
  document.getElementById('knowledge-state').textContent = count === 0
    ? 'No notes yet.' : '';
}

async function runSearch() {
  const q = document.getElementById('q').value.trim();
  const resultsEl = document.getElementById('results');
  const stateEl = document.getElementById('knowledge-state');
  if (!q) { resultsEl.innerHTML = ''; stateEl.textContent = ''; return; }

  let data;
  try {
    data = await (await fetch(`/api/storage/knowledge/search?q=${encodeURIComponent(q)}`)).json();
  } catch (e) {
    stateEl.textContent = `search failed: ${e}`;
    resultsEl.innerHTML = '';
    return;
  }
  stateEl.textContent = data.note || (data.state === 'partial' ? 'partial results' : '');
  const hits = data.results || [];
  resultsEl.innerHTML = hits.length === 0
    ? '<p class="placeholder">No matches.</p>'
    : hits.map(h => `<div class="hit"><div class="path">${h.doc_path}</div>` +
        `<div class="text">${h.text.slice(0, 200)}${h.text.length > 200 ? '…' : ''}</div></div>`
      ).join('');
}

async function checkEmbeddings() {
  let info;
  try {
    info = await (await fetch('/api/storage/embeddings/status')).json();
  } catch (e) {
    info = { state: 'error', problem: String(e), gateway: '', model: null };
  }
  const ok = info.state === 'ok';
  let html = '';
  html += row('gateway', info.gateway || '—');
  html += row('model', info.model || '(none configured)', !info.model);
  if (!ok) html += row('problem', info.problem || 'unreachable', true);
  document.getElementById('embeddings').innerHTML = html;
}

async function checkTrader() {
  let data;
  try {
    data = await (await fetch('/api/storage/trader/decisions?limit=10')).json();
  } catch (e) {
    data = { decisions: [] };
  }
  const decisions = data.decisions || [];
  document.getElementById('trader-count').textContent =
    `${decisions.length} recent`;
  document.getElementById('trader').innerHTML = decisions.length === 0
    ? '<p class="placeholder">No decisions logged yet — the trader agent itself is unbuilt; this is only its ledger.</p>'
    : decisions.map(d => `<div class="ledger-row"><span class="when">${d.recorded_at || d.path}</span>` +
        `<span>${d.symbol || ''} ${d.action || ''} ${d.thesis || ''}</span></div>`
      ).join('');
}

/* ---- B-04: structure trigger cards + drawers ---- */
const STRUCT = { code: null, agents: null, data: null };
const STRUCT_EP = {
  code: '/api/storage/structure/code',
  agents: '/api/storage/structure/agents',
  data: '/api/storage/structure/data',
};
const STRUCT_TITLE = { code: 'CODE STRUCTURE', agents: 'AGENT TREE', data: 'KAGE DATA SCHEMA' };

function esc(s) {
  return String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function ageOf(iso) {
  if (!iso) return { text: '', stale: false };
  const h = (Date.now() - new Date(iso).getTime()) / 3.6e6;
  const stale = h > 168;  // 7 days
  let s;
  if (h < 1) s = 'just now';
  else if (h < 48) s = `${Math.round(h)}h ago`;
  else s = `${Math.round(h / 24)}d ago`;
  return { text: `generated ${s}`, stale };
}

const sumCode = d => `${d.screens.length} screens · ${d.modules.length} modules · ${d.violations.length} violations`;
const sumAgents = d => `${d.agents.length} agents · ${d.brokers?.[0]?.types ?? 0} event types`;
const sumData = d => {
  const t = (d.databases || []).reduce((n, db) => n + (Array.isArray(db.tables) ? db.tables.length : 0), 0);
  return `${d.databases.length} database${d.databases.length === 1 ? '' : 's'} · ${t} tables`;
};

async function loadStructure() {
  await Promise.all(Object.keys(STRUCT_EP).map(async k => {
    try { STRUCT[k] = await (await fetch(STRUCT_EP[k])).json(); }
    catch (e) { STRUCT[k] = { state: 'error', problem: String(e) }; }
  }));
  fillCard('code', sumCode);
  fillCard('agents', sumAgents);
  fillCard('data', sumData);
}

function fillCard(k, summarise) {
  const d = STRUCT[k];
  const sumEl = document.getElementById('sum-' + k);
  const ageEl = document.getElementById('age-' + k);
  ageEl.textContent = '';
  ageEl.className = 'age';
  if (!d || d.state === 'error') {
    sumEl.textContent = (d && d.problem) || 'unreachable';
    sumEl.className = 's bad';
    return;
  }
  sumEl.className = 's';
  if (d.state === 'never') { sumEl.textContent = 'not generated yet — open to build'; return; }
  sumEl.textContent = summarise(d);
  const a = ageOf(d.generated_at);
  ageEl.textContent = a.text;
  ageEl.className = 'age' + (a.stale ? ' stale' : '');
}

async function openDrawer(kind) {
  const dlg = document.getElementById('drawer');
  const body = document.getElementById('drawer-body');
  const genEl = document.getElementById('drawer-gen');
  dlg.dataset.kind = kind;
  document.getElementById('drawer-title').textContent = STRUCT_TITLE[kind];

  if (!STRUCT[kind]) await loadStructure();
  const d = STRUCT[kind];

  if (d && d.generated_at) {
    const a = ageOf(d.generated_at);
    genEl.textContent = `${d.generated_at} · ${a.text}`;
    genEl.className = 'gen' + (a.stale ? ' stale' : '');
  } else {
    genEl.textContent = '';
    genEl.className = 'gen';
  }

  if (!d || d.state === 'never' || d.state === 'error') {
    body.innerHTML = `<p class="muted">${esc((d && d.problem) || 'not generated yet')}</p>` +
      `<button class="regen" type="button" onclick="regenStructure()">Regenerate now</button>`;
  } else {
    body.innerHTML = { code: renderCode, agents: renderAgents, data: renderData }[kind](d);
  }
  if (!dlg.open) dlg.showModal();
}

async function regenStructure() {
  const body = document.getElementById('drawer-body');
  const kind = document.getElementById('drawer').dataset.kind || 'code';
  body.innerHTML = '<p class="muted">regenerating…</p>';
  try {
    const r = await (await fetch('/api/storage/structure/regenerate', { method: 'POST' })).json();
    if (r.state !== 'ok') throw new Error(r.problem || 'generator failed');
    await loadStructure();
    openDrawer(kind);
  } catch (e) {
    body.innerHTML = `<p class="bad">regenerate failed: ${esc(e)}</p>` +
      `<button class="regen" type="button" onclick="regenStructure()">Try again</button>`;
  }
}

function renderCode(d) {
  const screens = d.screens.map(s => `
    <details class="tree-node">
      <summary>${esc(s.folder)} <span class="sub">:${esc(s.port)} · ${esc(s.page_kind)}</span></summary>
      <div class="sub">Backend — ${esc(s.backend_py_files)} files · ${esc(s.backend_lines)} lines</div>
      <div class="sub">tests — ${esc(s.tests)}</div>
      <div class="sub">tabs — ${(s.tabs || []).map(esc).join(', ') || '—'}</div>
      <div class="sub">entry — ${esc(s.entry)}</div>
    </details>`).join('');

  const groups = {};
  for (const b of d.boundaries) (groups[b.from] = groups[b.from] || []).push(b);
  const bmap = Object.keys(groups).sort().map(from => `
    <div class="bmap-group"><div class="from">${esc(from)}</div>
      ${groups[from].map(b =>
        `<div class="bmap-row">→ ${esc(b.to)} <span class="via ${esc(b.via)}">${esc(b.via)}</span> ${esc(b.evidence)}</div>`
      ).join('')}
    </div>`).join('') || '<p class="muted">No boundaries detected.</p>';

  const viol = d.violations.length === 0
    ? '<p class="muted">No violations — no screen imports another screen.</p>'
    : d.violations.map(v => `<div class="bmap-row viol">${esc(v.rule)} — ${esc(v.evidence)}</div>`).join('');

  return `<div class="two-col">
    <div><h4>Screens (${d.screens.length})</h4>${screens}
      <p class="sub">shared ${d.shared.length} · launchers ${d.launchers.length} · modules ${d.modules.length}</p></div>
    <div><h4>Boundaries (${d.boundaries.length})</h4>${bmap}
      <h4>Violations</h4>${viol}</div>
  </div>`;
}

function renderAgents(d) {
  const dots = d.agents.map(a =>
    `<div class="agent-dot">${esc(a.id)}<br><span class="tier">${esc(a.tier)} · ${esc(a.department || '—')}</span></div>`
  ).join('') || '<p class="muted">No agents.</p>';

  const orch = Object.entries(d.orchestration || {}).map(([k, v]) =>
    `<div class="bmap-row">${esc(k)} — ${esc(v.module || '')}${v.cadence ? ' · ' + esc(v.cadence) : ''}</div>`
  ).join('') || '<p class="muted">—</p>';

  const routing = (d.routing && d.routing.rows || []).map(r =>
    `<div class="bmap-row">${esc(r.task_class)} → ${(r.chain || []).map(esc).join(' · ')}</div>`
  ).join('') || '<p class="muted">No routing rows.</p>';

  const edges = (d.edges || []).length
    ? d.edges.map(e => `<div class="bmap-row">${esc(e.from)} → ${esc(e.to)} <span class="via import">${esc(e.kind)}</span></div>`).join('')
    : '<p class="muted">No edges recorded yet — populated once the seam wiring lands.</p>';

  const brokers = (d.brokers || []).map(b =>
    `<div class="bmap-row">${esc(b.name)} · ${esc(b.path)} · ${esc(b.types)} types → ${esc(b.projection)}</div>`
  ).join('') || '<p class="muted">—</p>';

  const legacy = d.legacy
    ? `<p class="sub">legacy agent folders present: ${esc(d.legacy.agent_folders_present ?? '—')}` +
      `${d.legacy.deleted_by_K07 != null ? ' · deleted by K-07: ' + esc(d.legacy.deleted_by_K07) : ''}</p>`
    : '';

  return `<h4>Agents (${d.agents.length})</h4><div class="dot-list">${dots}</div>${legacy}
    <h4>Orchestration</h4>${orch}
    <h4>Routing</h4>${routing}
    <h4>Edges</h4>${edges}
    <h4>Brokers</h4>${brokers}`;
}

function renderData(d) {
  const dbs = d.databases.map(db => {
    const tables = (db.tables || []).map(t => {
      if (typeof t === 'string') return `<div class="bmap-row">${esc(t)}</div>`;
      const cols = (t.columns || []).map(c =>
        `<tr><td>${esc(c.name)}</td><td>${esc(c.type)}</td><td>${c.pk ? 'PK ' : ''}${c.notnull ? 'NN' : ''}</td></tr>`
      ).join('');
      const fks = (t.foreign_keys || []).map(f => `<div class="sub">${esc(f.column)} → ${esc(f.references)}</div>`).join('');
      return `<details class="acc"><summary>${esc(t.name)} — ${esc(t.rows ?? '?')} rows <span class="muted">(as of generated_at)</span></summary>
        <table class="schema"><tr><th>column</th><th>type</th><th>flags</th></tr>${cols}</table>${fks}</details>`;
    }).join('');
    const views = (db.views || []).length ? `<div class="sub">views: ${db.views.map(esc).join(', ')}</div>` : '';
    return `<details class="acc"><summary>${esc(db.screen)} · ${esc(db.path)} · user_version ${esc(db.user_version)} · ${(db.tables || []).length} tables</summary>
      ${tables}${views}</details>`;
  }).join('') || '<p class="muted">No databases found.</p>';

  const events = (d.spine_events || []).map(e =>
    `<tr><td>${esc(e.type)}</td><td>${(e.producers || []).map(esc).join(', ') || '—'}</td><td>${(e.payload_keys || []).map(esc).join(', ') || '—'}</td></tr>`
  ).join('');

  const rules = (d.markdown_rules || []).map(r =>
    `<div class="bmap-row">${r.present === false ? '<span class="muted">(absent) </span>' : ''}` +
    `<span style="color:var(--amber)">${esc(r.path_pattern)}</span> — ${esc(r.writer)} — ${esc(r.rule)}</div>`
  ).join('') || '<p class="muted">—</p>';

  const rels = (d.relationships || []).length
    ? d.relationships.map(r => `<div class="bmap-row">${esc(r.from)} → ${esc(r.to)}</div>`).join('')
    : '<p class="muted">No cross-table relationships detected.</p>';

  return `<h4>Databases (${d.databases.length})</h4>${dbs}
    <h4>Spine event types (${(d.spine_events || []).length})</h4>
    <table class="schema"><tr><th>type</th><th>producers</th><th>payload keys</th></tr>${events}</table>
    <h4>Markdown rules</h4>${rules}
    <h4>Relationships</h4>${rels}`;
}

function refreshAll() {
  checkStore();
  checkKnowledge();
  checkEmbeddings();
  checkTrader();
  loadStructure();
}
refreshAll();
setInterval(refreshAll, 15000);
</script>
