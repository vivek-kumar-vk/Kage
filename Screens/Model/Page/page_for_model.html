<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MODEL // gateway</title>
    <!-- This screen's OWN theme - not /shared. Complete independent component. -->
    <link rel="stylesheet" href="/page/theme_for_model.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <h1 class="title">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9 5a3 3 0 0 0-3 3 3 3 0 0 0-1 5.8V16a3 3 0 0 0 5 2 3 3 0 0 0 5-2v-2.2A3 3 0 0 0 15 8a3 3 0 0 0-3-3 3 3 0 0 0-3 0z"
              fill="none"
              stroke="#ff7a00"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
          </svg>
          MODEL <span class="accent">gateway</span>
        </h1>
        <p class="sub">OmniRoute dashboard &middot; local &middot; auto-routing + fallback</p>
      </header>

      <!-- Status bar: shows gateway state before the iframe loads -->
      <div class="status-bar" id="status-bar">
        <span class="state" id="state" data-s="loading">
          <span class="dot"></span>
          <span id="state-text">connecting&hellip;</span>
        </span>
        <a class="dash-link" id="dash-link" href="http://127.0.0.1:8003" target="_blank" rel="noopener" style="display:none">
          open in new tab &nearr;
        </a>
      </div>

      <!-- The iframe - fills the remaining viewport -->
      <div class="gateway-frame-wrap" id="frame-wrap" style="display:none">
        <iframe
          id="gateway-frame"
          class="gateway-frame"
          src="http://127.0.0.1:8003"
          title="OmniRoute Dashboard"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
          loading="lazy"
        ></iframe>
      </div>

      <!-- Fallback when gateway is unreachable -->
      <section class="panel" id="fallback" style="display:none">
        <p class="panel-label">Gateway unreachable</p>
        <p id="fallback-why">
          OmniRoute is not running at <code>127.0.0.1:8003</code>.
          Start it with <code>python Start_Inky/run_omniroute.py</code>,
          then refresh this page.
        </p>
        <button class="retry-btn" id="retry-btn">retry</button>
      </section>

      <a class="back" href="/">&larr; Back to menu</a>
    </main>

    <script>
      // Probe the gateway health endpoint, then show iframe or fallback.
      // This screen carries its own tiny bit of page JS - no shared script bundle.
      (function () {
        var stateEl  = document.getElementById("state");
        var textEl   = document.getElementById("state-text");
        var frameWrap = document.getElementById("frame-wrap");
        var frame    = document.getElementById("gateway-frame");
        var fallback = document.getElementById("fallback");
        var dashLink = document.getElementById("dash-link");
        var retryBtn = document.getElementById("retry-btn");

        function probe() {
          stateEl.setAttribute("data-s", "loading");
          textEl.textContent = "connecting\u2026";
          fallback.style.display = "none";
          frameWrap.style.display = "none";

          fetch("/api/model/overview", { headers: { accept: "application/json" } })
            .then(function (r) {
              return r.ok ? r.json() : Promise.reject(new Error(String(r.status)));
            })
            .then(function (d) {
              if (d.gateway === "ok") {
                stateEl.setAttribute("data-s", "ok");
                textEl.textContent = "gateway up";
                dashLink.style.display = "";
                frameWrap.style.display = "";
                // Reload iframe src in case it was stale
                frame.src = "http://127.0.0.1:8003";
              } else {
                showDown(d.why || "Gateway reported state: " + d.gateway);
              }
            })
            .catch(function (e) {
              showDown("Could not reach this screen\u2019s own API (" + e.message + ")");
            });
        }

        function showDown(reason) {
          stateEl.setAttribute("data-s", "unreachable");
          textEl.textContent = "gateway unreachable";
          dashLink.style.display = "none";
          frameWrap.style.display = "none";
          fallback.style.display = "";
          var whyEl = document.getElementById("fallback-why");
          if (reason) {
            whyEl.textContent = reason;
          }
        }

        retryBtn.addEventListener("click", probe);
        probe();

        // Auto-retry every 30s when down
        setInterval(function () {
          if (stateEl.getAttribute("data-s") !== "ok") {
            probe();
          }
        }, 30000);
      })();
    </script>
  </body>
</html>
