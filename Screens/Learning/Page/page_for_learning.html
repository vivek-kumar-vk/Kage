<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INKY.GG — Learning</title>
<link rel="stylesheet" href="/page/css/style_for_learning.css">
</head>
<body>

  <div class="header-bar">
    <div class="header-banner"><span>LEARNING</span></div>
    <a class="back-to-menu" href="/">&#8592; BACK TO MENU</a>
  </div>

  <div class="app-body">

    <!-- slim icon rail: Today / Plan / Recall - Study merged into Plan
         2026-08-24 (ADR-100): a topic in Plan is where learning starts
         now, not a separate tab a click away from it. -->
    <nav class="rail" id="rail" aria-label="Learning sections">
      <span class="rail-pill" id="rail-pill"></span>
      <button class="rail-item active" data-tab="today" type="button">
        <span class="rail-icon">&#9673;</span><span class="rail-label">Today</span>
      </button>
      <button class="rail-item" data-tab="plan" type="button">
        <span class="rail-icon">&#9636;</span><span class="rail-label">Plan</span>
        <span class="rail-badge" id="badge-plan" hidden></span>
      </button>
      <button class="rail-item" data-tab="recall" type="button">
        <span class="rail-icon">&#9670;</span><span class="rail-label">Recall</span>
        <span class="rail-badge" id="badge-recall" hidden></span>
      </button>
    </nav>

    <main class="content">

      <!-- ═══════ TODAY ═══════ -->
      <section class="tab-pane active" id="pane-today" aria-label="Today">
        <div class="bento" id="today-bento"></div>
      </section>

      <!-- ═══════ PLAN ═══════ -->
      <section class="tab-pane" id="pane-plan" aria-label="Plan">
        <div class="subnav" id="plan-subnav">
          <span class="subnav-thumb" id="plan-thumb"></span>
          <button type="button" data-sub="topics" class="active">Topics</button>
          <button type="button" data-sub="week">This Week</button>
        </div>
        <div id="plan-body"></div>
        <div class="section-title">Loose items</div>
        <div id="plan-loose"></div>
      </section>

      <!-- ═══════ RECALL ═══════ -->
      <!-- The Leitner "notes review" queue is gone (ADR-100): every
           Knowledge_Base note sat in it as permanently "due", never
           reviewed even once - a real count that told you nothing. My
           cards is the one designed review experience left, so it is
           the whole tab now; no sub-nav needed for one view. -->
      <section class="tab-pane" id="pane-recall" aria-label="Recall">
        <div id="recall-body"></div>
      </section>

    </main>
  </div>

  <!-- modal + toast roots -->
  <div class="modal-scrim" id="modal-scrim" hidden>
    <div class="modal" id="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ═══ THE READER - interactive markdown study window ═══ -->
  <div class="reader-scrim" id="reader-scrim" hidden>
    <div class="reader-window" role="dialog" aria-modal="true" aria-label="Note reader">
      <header class="reader-head">
        <div class="reader-titles">
          <div class="reader-title" id="reader-title">Note</div>
          <div class="reader-meta mono" id="reader-meta"></div>
        </div>
        <div class="reader-session" id="reader-session" hidden>
          <span class="pulse-dot"></span>
          <span data-elapsed>--:--</span>
          <button class="btn danger small" data-action="reader-stop" type="button">STOP SESSION</button>
        </div>
        <button class="reader-close" data-action="reader-close" type="button"
                aria-label="Close reader">&#10005;</button>
      </header>
      <div class="reader-toolbar">
        <span class="reader-hint">Select text, then right-click it to add a note.</span>
        <label class="reader-notes-label" for="reader-stop-notes">Session notes
          <input class="field" id="reader-stop-notes" placeholder="what did this block cover?" maxlength="300"></label>
      </div>
      <!-- the module room: filled in only when the opened note is a
           study-module; an ordinary note leaves it hidden -->
      <div class="module-room" id="reader-module" hidden></div>
      <article class="reader-body" id="reader-body" tabindex="0"></article>
    </div>
  </div>

  <!-- right-click menu inside the reader -->
  <div class="reader-menu" id="reader-menu" hidden></div>

  <!-- add-note popover -->
  <div class="anno-editor" id="anno-editor" hidden>
    <div class="anno-quote mono" id="anno-quote"></div>
    <textarea class="field" id="anno-text" rows="3" maxlength="2000"
              placeholder="your note on this passage&#8230;"></textarea>
    <div class="form-actions">
      <button class="btn ghost small" data-action="anno-cancel" type="button">CANCEL</button>
      <button class="btn primary small" data-action="anno-save" type="button">SAVE NOTE</button>
    </div>
  </div>

  <!-- viewing one existing annotation -->
  <div class="anno-viewer" id="anno-viewer" hidden>
    <div class="anno-quote mono" id="anno-view-quote"></div>
    <div class="anno-view-text" id="anno-view-text"></div>
    <div class="form-actions">
      <button class="btn ghost small" data-action="anno-hide" type="button">CLOSE</button>
      <button class="btn danger small" data-action="anno-delete" type="button">DELETE NOTE</button>
    </div>
  </div>

  <!-- notes explorer drawer -->
  <div class="explorer-scrim" id="explorer-scrim" hidden>
    <aside class="explorer-drawer" role="dialog" aria-modal="true" aria-label="Notes explorer">
      <header class="explorer-head">
        <div>
          <div class="card-label">Notes explorer</div>
          <div class="card-sub" id="explorer-count"></div>
        </div>
        <button class="reader-close" data-action="explorer-close" type="button"
                aria-label="Close notes explorer">&#10005;</button>
      </header>
      <input type="search" class="field" id="explorer-search" placeholder="search notes&#8230;">
      <nav class="explorer-list" id="explorer-list"></nav>
    </aside>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script src="/page/js/script_for_learning.js"></script>
<script>window.INKY_TRACE = { actor: 'learning', api: '/api/learning' };</script>
<script src="/shared/page_tracer.js" defer></script>
<script src="/shared/auto_refresh_watch.js" defer></script>
  <script src="/shared/block_guards.js" defer></script>
</body>
</html>
