<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INKY.GG — Enhancement</title>
<link rel="stylesheet" href="/page/css/style_for_enhancement.css">
</head>
<body>

  <div class="header-bar">
    <div class="header-banner"><span>ENHANCEMENT</span></div>
    <a class="back-to-menu" href="/">&#8592; BACK TO MENU</a>
  </div>

  <div class="app-body">
    <div class="sidebar">
      <button class="side-tab active" data-tab="board">Board<span class="sub">ideas, so they aren't lost</span></button>
    </div>

    <div class="content">

      <!-- ═══════ BOARD ═══════ -->
      <div class="tab-pane active" id="pane-board">
        <div class="card-row" id="enhancement-stats"></div>

        <div class="panel">
          <div class="panel-title">Capture an idea</div>
          <div class="add-row">
            <input type="text" id="idea-title" placeholder="The idea, in a few words" maxlength="120">
            <input type="text" id="idea-area" placeholder="Which screen/tab it's about (optional)" maxlength="60">
            <button class="mini-btn" id="idea-add-btn">ADD</button>
          </div>
          <textarea id="idea-note" placeholder="Any detail worth keeping (optional)" maxlength="600" rows="2" style="width:100%;margin-top:8px"></textarea>
          <div id="idea-error"></div>
        </div>

        <div class="panel enhancement-filter-panel">
          <div class="filter-row">
            <input type="text" class="filter-input" id="idea-search" placeholder="Search title, note or area">
            <select class="filter-input" id="idea-area-filter"><option value="">All areas</option></select>
            <div class="segmented" id="idea-source-filter">
              <button type="button" class="seg-btn active" data-value="all">ALL</button>
              <button type="button" class="seg-btn" data-value="user">YOU</button>
              <button type="button" class="seg-btn" data-value="ai">AI</button>
            </div>
            <label class="toggle-row"><input type="checkbox" id="idea-show-done"> show done</label>
          </div>
        </div>

        <div id="enhancement-board-empty"></div>
        <div class="kanban" id="enhancement-board"></div>
      </div>

    </div>
  </div>

  <!-- ═══════ IDEA MODAL ═══════ -->
  <div class="modal-overlay" id="idea-modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span class="modal-key" id="modal-key"></span>
        <button type="button" class="mini-btn refuse" id="modal-close-btn">CLOSE</button>
      </div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-fields">
        <label>Priority
          <select id="modal-priority"></select>
        </label>
        <label>Status
          <select id="modal-status"></select>
        </label>
        <label>Area
          <input type="text" id="modal-area" maxlength="60" placeholder="Which screen/tab it's about">
        </label>
      </div>
      <div class="modal-section-title">Note</div>
      <div class="modal-note" id="modal-note"></div>
      <div class="modal-section-title">Comments</div>
      <div class="modal-comments" id="modal-comments"></div>
      <div class="comment-add-row">
        <input type="text" id="modal-comment-input" placeholder="Add a comment" maxlength="300">
        <button type="button" class="mini-btn" id="modal-comment-add">ADD</button>
      </div>
      <div id="modal-error"></div>
      <div class="modal-actions">
        <button type="button" class="mini-btn good" id="modal-save-btn">SAVE</button>
        <button type="button" class="mini-btn refuse" id="modal-delete-btn">DELETE</button>
      </div>
    </div>
  </div>

<script src="/page/js/script_for_enhancement.js?v=kanban1"></script>
<script>window.INKY_TRACE = { actor: 'enhancement', api: '/api/enhancement' };</script>
<script src="/shared/page_tracer.js" defer></script>
<script src="/shared/auto_refresh_watch.js" defer></script>
  <script src="/shared/block_guards.js" defer></script>
</body>
</html>
