<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finance Telemetry — build progress</title>
<style>
  :root {
    --bg:#0b0d10; --panel:#14181d; --raised:#1c222a; --line:#2a3038;
    --bone:#e8e4da; --dim:#8b9099; --amber:#ff7a00; --gold:#f2a93b;
    --jade:#3fd9a4; --red:#e33b2e; --blue:#4aa3ff;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--bone);
    font-family:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size:13px; line-height:1.5; padding:24px;
  }
  h1 { font-size:15px; letter-spacing:.16em; text-transform:uppercase; margin:0 0 4px; }
  .meta { color:var(--dim); font-size:11px; margin-bottom:16px; }
  .meta b { color:var(--gold); font-weight:600; }
  .bar {
    display:flex; height:8px; border:1px solid var(--line); border-radius:2px;
    overflow:hidden; margin:12px 0 18px; background:var(--bg);
  }
  .bar i { display:block; }
  .bar .clean { background:var(--jade); }
  .bar .written { background:var(--blue); }
  .bar .sent { background:var(--gold); }
  .bar .rework { background:var(--red); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
  td.id { color:var(--dim); width:44px; }
  td.file { color:var(--bone); }
  td.owner { color:var(--dim); width:80px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:3px; font-size:10px;
          letter-spacing:.1em; text-transform:uppercase; border:1px solid currentColor; }
  .s-queued  { color:var(--dim); }
  .s-sent    { color:var(--gold); }
  .s-written { color:var(--blue); }
  .s-clean   { color:var(--jade); }
  .s-rework  { color:var(--red); }
  tr.now td { background:rgba(255,122,0,.06); }
  .log { margin-top:22px; border-top:1px solid var(--line); padding-top:12px; }
  .log h2 { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:0 0 8px; }
  .log ul { margin:0; padding-left:16px; }
  .log li { color:var(--dim); margin-bottom:3px; }
  .log li b { color:var(--bone); font-weight:600; }
  .foot { margin-top:18px; color:var(--dim); font-size:10px; }
</style>
</head>
<body>
<h1>Finance Telemetry — build progress</h1>
<div class="meta">
  code author <b id="model">qwen2.5-coder-7b @ :8080</b> ·
  orchestrator Claude · <span id="phase">harness ready</span> ·
  updated <span id="updated">—</span>
</div>
<div class="bar" id="bar"></div>
<table>
  <thead><tr><th>#</th><th>File</th><th>Owner</th><th>Status</th><th>Note</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="log"><h2>Log</h2><ul id="log"></ul></div>
<div class="foot">auto-refreshes every 3s · source: progress.json</div>

<script>
const CLASS = { queued:"s-queued", sent:"s-sent", written:"s-written", clean:"s-clean", rework:"s-rework" };
async function tick() {
  try {
    const r = await fetch("progress.json?" + Date.now());
    const d = await r.json();
    document.getElementById("model").textContent = d.model || "—";
    document.getElementById("phase").textContent = d.phase || "—";
    document.getElementById("updated").textContent = d.updated || "—";
    const c = d.counts || {};
    const total = d.tasks.length || 1;
    const seg = (n, cls) => n ? `<i class="${cls}" style="width:${(n/total*100).toFixed(2)}%"></i>` : "";
    document.getElementById("bar").innerHTML =
      seg(c.clean,"clean") + seg(c.written,"written") + seg(c.sent,"sent") + seg(c.rework,"rework");
    document.getElementById("rows").innerHTML = d.tasks.map(t => `
      <tr class="${t.id === d.current ? "now" : ""}">
        <td class="id">${t.id}</td>
        <td class="file">${t.file}</td>
        <td class="owner">${t.owner}</td>
        <td><span class="pill ${CLASS[t.status] || "s-queued"}">${t.status}</span></td>
        <td style="color:var(--dim)">${t.note || ""}</td>
      </tr>`).join("");
    document.getElementById("log").innerHTML =
      (d.log || []).slice(-40).reverse().map(l => `<li><b>${l.t || ""}</b> ${l.m || ""}</li>`).join("")
      || "<li>build not started</li>";
  } catch (e) {
    document.getElementById("phase").textContent = "waiting for progress.json…";
  }
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
